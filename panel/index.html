<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Omo Preset</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        background: transparent;
        color: var(--oc-fg, #ddd);
        font-family: var(--oc-font, system-ui, sans-serif);
        font-size: 13px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      button { font: inherit; color: inherit; }
      [hidden] { display: none !important; }
      :focus-visible { outline: none; box-shadow: 0 0 0 2px var(--oc-focus, #6aa9ff); }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding: 10px 12px 12px;
        min-width: 0;
      }
      .icon-btn {
        flex: none;
        width: 22px;
        height: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--oc-muted, #999);
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
      }
      .icon-btn:hover:not(:disabled) { background: var(--oc-hover, rgba(127, 127, 127, 0.15)); color: var(--oc-fg, #ddd); }
      .icon-btn:disabled { opacity: 0.5; cursor: default; }

      .active-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .active-row .preset-trigger { width: auto; flex: 1 1 auto; min-width: 0; }
      .active-row .icon-btn { flex: none; }
      .preset-trigger {
        display: flex;
        align-items: center;
        gap: 7px;
        width: 100%;
        min-width: 0;
        padding: 4px 6px;
        border: 1px solid transparent;
        border-radius: calc(var(--oc-radius, 8px) * 0.75);
        background: transparent;
        text-align: start;
        cursor: pointer;
        transition: background 120ms ease, border-color 120ms ease;
      }
      .preset-trigger:hover:not(:disabled) { background: var(--oc-hover, rgba(127, 127, 127, 0.15)); }
      .preset-trigger[aria-expanded="true"] {
        background: var(--oc-hover, rgba(127, 127, 127, 0.15));
        border-color: var(--oc-border, rgba(127, 127, 127, 0.28));
      }
      .preset-trigger:disabled { opacity: 0.5; cursor: default; }
      .preset-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 600;
      }
      .chevron {
        flex: none;
        color: var(--oc-muted, #999);
        font-size: 10px;
        line-height: 1;
        width: 10px;
        text-align: center;
      }

      .preset-list {
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 3px;
        border: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
        border-radius: calc(var(--oc-radius, 8px) * 0.75);
        background: var(--oc-elevated, rgba(127, 127, 127, 0.06));
      }
      .preset-option {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-width: 0;
        padding: 5px 7px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        text-align: start;
        cursor: pointer;
      }
      .preset-option:hover:not(:disabled),
      .preset-option:focus-visible { background: var(--oc-hover, rgba(127, 127, 127, 0.15)); box-shadow: none; }
      .preset-option[data-active="true"] {
        background: var(--oc-selection, rgba(120, 160, 255, 0.2));
        color: var(--oc-selection-fg, inherit);
      }
      .preset-option:disabled { opacity: 0.5; cursor: default; }
      .option-label { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
      .option-name { font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .option-model {
        font: 10.5px/1.35 var(--oc-mono, ui-monospace, monospace);
        color: var(--oc-muted, #999);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .preset-option[data-active="true"] .option-model { color: inherit; opacity: 0.75; }
      .option-check { flex: none; font-size: 11px; color: var(--oc-info, #3fa9f5); }
      .preset-option[data-active="true"] .option-check { color: inherit; }

      /* Zwei geteilte Spalten über alle Zeilen: Agenten links (Breite =
         breitester Name), Modelle bündig rechts und nie in der Agenten-
         Spalte. display:contents macht Tiefenstruktur zu Grid-Kindern. */
      .agents {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        column-gap: 12px;
        row-gap: 2px;
        align-items: center;
        padding-top: 1px;
      }
      .agents-empty { grid-column: 1 / -1; font-size: 11px; color: var(--oc-muted, #999); }
      .agent-group, .agent { display: contents; }
      .agent-disclosure { grid-column: 1; }
      .agent-name { grid-column: 1; }
      .agent-model { grid-column: 2; }
      .agent-name {
        min-width: 0;
        max-width: 24ch;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 11.5px;
        color: var(--oc-muted, #999);
      }
      .agent-model {
        display: flex;
        align-items: baseline;
        justify-content: flex-end;
        gap: 5px;
        min-width: 0;
        font: 11px/1.4 var(--oc-mono, ui-monospace, monospace);
        text-align: right;
      }
      /* Modell-ID und Variant-Pill bleiben immer voll sichtbar; nur der
         dezente Provider-Anteil wird bei Platzmangel mit „…“ gekürzt. */
      .model-text {
        display: inline-flex;
        flex: 0 1 auto;
        min-width: 0;
        max-width: 100%;
      }
      .model-provider {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--oc-muted, #999);
      }
      .model-content { flex: 0 0 auto; white-space: nowrap; }
      /* Modell-ID wird bei Platzmangel links abgeschnitten, damit ihr Ende
         und die Variante rechts immer sichtbar bleiben. */
      .model-text .model-content {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        direction: rtl;
        unicode-bidi: plaintext;
        text-align: right;
      }
      .variant {
        flex: 0 0 auto;
        padding: 0 5px;
        border: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
        border-radius: 999px;
        color: var(--oc-muted, #999);
        font: 10px/1.6 var(--oc-mono, ui-monospace, monospace);
        white-space: nowrap;
      }
      .agent-disclosure {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
        min-height: 24px;
        margin: -2px 0 -2px -4px;
        padding: 2px 4px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .agent-disclosure:hover, .agent-disclosure[aria-expanded="true"] { background: var(--oc-hover, rgba(127, 127, 127, 0.15)); }
      .agent-disclosure .agent-name { max-width: none; }
      .session-count { flex: none; color: var(--oc-info, #3fa9f5); font-size: 12.5px; line-height: 1; }
      /* Fertige Sessions: Ziffer im Quadrat — Unicode kennt keine, also zeichnet
         CSS den Rahmen (flexibles Rundeck statt Emoji-Keycaps). */
      .session-count.is-done {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 13px;
        height: 13px;
        padding: 0 2px;
        border: 1px solid var(--oc-success, #a6e3a1);
        border-radius: 3.5px;
        color: var(--oc-success, #a6e3a1);
        font: 9.5px/1 var(--oc-mono, ui-monospace, monospace);
      }
      .session-count sup { font-size: 9px; }
      .agent-chevron { flex: none; color: var(--oc-muted, #999); font-size: 9px; }
      /* Session-Baum: eingerückt unter dem Agenten, keine eigene Box,
         Schriftgröße maximal auf Höhe des Agenten-Texts. */
      .session-list {
        grid-column: 1 / -1;
        display: flex;
        flex-direction: column;
        gap: 1px;
        max-height: 220px;
        overflow-y: auto;
        margin: 0 0 4px 6px;
        padding: 0 0 0 10px;
        border-left: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
      }
      .session-option {
        display: flex;
        align-items: baseline;
        gap: 5px;
        min-width: 0;
      }
      .session-option.is-done .session-title { color: var(--oc-muted, #999); }
      .session-open {
        display: flex;
        align-items: baseline;
        gap: 5px;
        flex: 1 1 auto;
        min-width: 0;
        padding: 1px 4px;
        border: 0;
        border-radius: 4px;
        background: none;
        cursor: pointer;
        color: inherit;
        font: inherit;
        text-align: left;
      }
      .session-open:hover { background: var(--oc-hover, rgba(127, 127, 127, 0.15)); }
      .session-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
      .session-activity { flex: none; color: var(--oc-muted, #999); font-size: 10px; }
      .session-activity.is-live { color: var(--oc-info, #3fa9f5); font-variant-numeric: tabular-nums; min-width: 3.5ch; text-align: right; }
      .session-hide {
        flex: none;
        display: inline-flex;
        align-items: center;
        padding: 1px 4px;
        border: 0;
        border-radius: 4px;
        background: none;
        cursor: pointer;
        color: var(--oc-muted, #999);
        font-size: 9px;
        line-height: 1;
      }
      .session-hide:hover { color: var(--oc-fg, #ddd); background: var(--oc-hover, rgba(127, 127, 127, 0.15)); }

      .tree-section {
        min-width: 0;
        padding-top: 5px;
        border-top: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
      }
      .tree-section-trigger {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        min-height: 24px;
        padding: 3px 4px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--oc-muted, #999);
        font-size: 11px;
        text-align: left;
        cursor: pointer;
      }
      .tree-section-trigger:hover, .tree-section-trigger[aria-expanded="true"] { background: var(--oc-hover, rgba(127, 127, 127, 0.15)); }
      .tree-list, .tree-children { list-style: none; padding: 0; }
      .tree-list { max-height: 240px; overflow: auto; margin: 3px 0 0; }
      .tree-children { margin: 0 0 0 12px; padding-left: 4px; border-left: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28)); }
      .tree-children.is-deep { margin-left: 0; padding-left: 0; border-left: 0; }
      .tree-item { min-width: 0; }
      .tree-row { display: flex; align-items: flex-start; min-width: 0; }
      .tree-disclosure, .tree-disclosure-spacer {
        flex: none;
        width: 22px;
        height: 24px;
      }
      .tree-disclosure {
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--oc-muted, #999);
        font-size: 10px;
        cursor: pointer;
      }
      .tree-disclosure:hover { background: var(--oc-hover, rgba(127, 127, 127, 0.15)); }
      .tree-session {
        display: flex;
        flex: 1 1 0;
        flex-direction: column;
        align-items: stretch;
        min-width: 0;
        min-height: 24px;
        padding: 4px 5px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .tree-session:hover { background: var(--oc-hover, rgba(127, 127, 127, 0.15)); }
      .tree-headline { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
      .tree-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; }
      .tree-child-count { flex: none; color: var(--oc-muted, #999); font-size: 10px; }
      .tree-details { display: flex; flex-wrap: wrap; gap: 1px 6px; min-width: 0; color: var(--oc-muted, #999); font-size: 10px; line-height: 1.4; }
      .tree-state, .tree-outcome { flex: none; }
      .tree-state.is-live { color: var(--oc-info, #3fa9f5); }
      .tree-metadata { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--oc-mono, ui-monospace, monospace); }

      /* Model availability: missing refs stand out on the agent row and in the check line. */
      .agent-group.is-missing .model-content { color: var(--oc-destructive, #f38ba8); }
      .agent-group.is-missing .agent-disclosure .agent-name { color: var(--oc-destructive, #f38ba8); }
      .agent-group.is-missing .agent-name { color: var(--oc-destructive, #f38ba8); }
      .confirm {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px;
        border: 1px solid var(--oc-border, rgba(127, 127, 127, 0.28));
        border-radius: calc(var(--oc-radius, 8px) * 0.9);
        background: var(--oc-muted-surface, rgba(127, 127, 127, 0.08));
      }
      .confirm-title { font-size: 13px; font-weight: 600; }
      .confirm-body { font-size: 11.5px; line-height: 1.5; color: var(--oc-muted, #999); overflow-wrap: anywhere; }
      .confirm-body code {
        padding: 0 3px;
        border-radius: 3px;
        background: var(--oc-bg, transparent);
        color: var(--oc-fg, #ddd);
        font: 10.5px var(--oc-mono, ui-monospace, monospace);
      }
      .confirm-hint { font-size: 11px; line-height: 1.45; color: var(--oc-info-text, var(--oc-muted, #999)); }
      .confirm-actions { display: flex; justify-content: flex-end; gap: 6px; }

      .loading { padding: 8px 2px; }

      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js?v=1.2.1"></script>
  </body>
</html>
